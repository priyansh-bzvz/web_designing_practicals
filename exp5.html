<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form action="submit.html" method="post">

        <label for="name">Full Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <label for="course">Course:</label>

        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
        </select>

        <br><br>

        <label for="contact">Contact No: </label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number" required>
        <br><br>

        <label for="address">Address: </label>
        <br>

        <textarea id="address" name="address" rows="7" cols="60" 
        placeholder="Enter your address" required></textarea>

        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear</button>

    </form>

    <hr>

    <footer align="center">
        <p> &copy; 2026 Student Registration Portal</p>
    </footer>

    </footer>

</body>
</html>
