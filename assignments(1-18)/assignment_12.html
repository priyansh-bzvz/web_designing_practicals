<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Headers, Caption and Footer</title>
</head>
<body>
    <table border="1" cellspacing="2" cellpadding="7">
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <td><b>Roll</b></td>
                <td><b>Name</b></td>
                <td><b>Marks</b></td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Average</td>
                <td>86.5</td>
            </tr>
        </tfoot>
    </table>
    <hr>
    <footer>
        <p>Name: Priyansh Singh <br>
        Admission No.: 2026B01010734 <br>
        Section: CSE-11</p>
    </footer>
</body>
</html>
