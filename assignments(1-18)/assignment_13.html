<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowspan and Colspan (Timetable)</title>
</head>
<body>
    <table border="1" cellspacing="1" cellpadding="7">
        <caption><b>Weekly Timetable</b></caption>
        <thead>
            <tr align="center">
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td>Mon</td>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr align="center">
                <td>Tue</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
        </tbody>
        <tfoot>
            <tr align="center">
                <td>Wed</td>
                <td colspan="3">Seminar</td>
            </tr>
        </tfoot>
    </table>
    <hr>
    <footer>
        <p>Name: Priyansh Singh <br>
        Admission No.: 2026B01010734 <br>
        Section: CSE-11</p>
    </footer>
</body>
</html>
