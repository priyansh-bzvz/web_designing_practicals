<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel room booking</title>
</head>

<body>
    <h1 align="center">Hotel Room Booking form</h1>
    <form align="Center">
        <label for="Full name">Full name: </label>
        <input type="text" id="full name" name="Full name"><br><br>

        <label for="Email">Email: </label>
        <input type="text" id="Email" name="Email"><br><br>

        <label for="phone number">Phone: </label>
        <input type="number" id="phone number" name="phone"><br><br>
        
        <label for="checkindate">Check-in Date: </label>
        <input type="date" id="checkindate" name="date"><br><br>

        <label for="checkoutdate">Check-out Date: </label>
        <input type="date" id="checkoutdate" name="date"><br><br>
     
        <label for="guests">Number of Guests: </label>
        <input type="number" id="guests" name="guests"><br><br>
       
        <label for="room">Room Type: </label>
        <select id="room" name="room">
            <option>Single Room</option>
            <option>Double Room</option>
            <option>Deluxe Room</option>
        </select><br><br>

        <label for="requests">Special Requests:</label>
        <br>
        <textarea id="requests" name="requests" rows="4" cols="30"></textarea><br><br>

        <button type="submit">Book Now</button>
        <button type="reset">Reset</button>
    </form>
    <hr>
    <footer>
        <p>Name: Priyansh Singh</p>
        <p>Admission No.: 2026B01010734</p>
        <p>Section: CSE-11</p>
    </footer>
</body>

</html>
